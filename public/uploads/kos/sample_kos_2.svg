<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad2)"/>
  <circle cx="200" cy="100" r="120" fill="#ffffff" fill-opacity="0.02" />
  
  <g transform="translate(180, 70)">
    <rect x="0" y="40" width="440" height="280" rx="20" fill="url(#cardGrad2)" stroke="#52525b" stroke-width="2"/>
    <!-- Workspace -->
    <rect x="60" y="150" width="160" height="15" rx="4" fill="#a1a1aa"/>
    <rect x="70" y="165" width="10" height="80" fill="#71717a"/>
    <rect x="200" y="165" width="10" height="80" fill="#71717a"/>
    <!-- Laptop -->
    <polygon points="110,148 150,148 155,150 105,150" fill="#f4f4f5"/>
    <rect x="115" y="120" width="30" height="26" rx="3" fill="#e4e4e7" stroke="#3f3f46" stroke-width="1"/>
    <!-- Wardrobe -->
    <rect x="280" y="90" width="100" height="160" rx="8" fill="#3f3f46" stroke="#71717a" stroke-width="2"/>
    <line x1="330" y1="90" x2="330" y2="250" stroke="#52525b" stroke-width="2"/>
    <circle cx="320" cy="170" r="3" fill="#f4f4f5"/>
    <circle cx="340" cy="170" r="3" fill="#f4f4f5"/>
  </g>
  <text x="400" y="420" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#f4f4f5" letter-spacing="1">FASILITAS LENGKAP &amp; BERSIH</text>
  <text x="400" y="450" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#a1a1aa">kosKu • Cari Kos Langsung dari Peta</text>
</svg>
