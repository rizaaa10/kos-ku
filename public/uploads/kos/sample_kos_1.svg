<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad1)"/>
  <circle cx="680" cy="90" r="140" fill="#ffffff" fill-opacity="0.03" />
  <circle cx="120" cy="420" r="180" fill="#ffffff" fill-opacity="0.03" />
  
  <!-- Architectural Room Outline -->
  <g transform="translate(180, 70)">
    <rect x="0" y="40" width="440" height="280" rx="20" fill="url(#cardGrad)" stroke="#52525b" stroke-width="2"/>
    <!-- Window -->
    <rect x="50" y="80" width="100" height="110" rx="10" fill="#09090b" stroke="#71717a" stroke-width="2"/>
    <line x1="100" y1="80" x2="100" y2="190" stroke="#71717a" stroke-width="2"/>
    <line x1="50" y1="135" x2="150" y2="135" stroke="#71717a" stroke-width="2"/>
    <!-- Bed -->
    <rect x="200" y="140" width="190" height="140" rx="12" fill="#27272a" stroke="#a1a1aa" stroke-width="2"/>
    <rect x="220" y="160" width="60" height="40" rx="8" fill="#3f3f46"/>
    <rect x="220" y="210" width="150" height="60" rx="8" fill="#52525b"/>
    <!-- Lamp & Table -->
    <rect x="160" y="180" width="30" height="50" rx="4" fill="#3f3f46"/>
    <circle cx="175" cy="170" r="12" fill="#f4f4f5" fill-opacity="0.8"/>
  </g>
  <text x="400" y="420" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#f4f4f5" letter-spacing="1">KAMAR MODERN &amp; NYAMAN</text>
  <text x="400" y="450" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#a1a1aa">kosKu • Cari Kos Langsung dari Peta</text>
</svg>
